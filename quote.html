<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotation — enter supplier quotes</title>
<style>
  body{font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;margin:0;color:#1a2433;background:#f4f6f9}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 4px}
  .meta{color:#555;font-size:13px;margin-bottom:6px}
  .note{font-size:12px;color:#555;margin:6px 0 12px}
  .top{display:flex;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #d9e1ec;border-radius:8px;padding:12px;margin-bottom:12px}
  .top .fld{display:flex;flex-direction:column;gap:3px}
  .top label{font-size:11px;color:#666}
  .top input{border:1px solid #c3ccda;border-radius:6px;padding:7px 9px;font-size:13px;min-width:150px}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .btn{background:#1f6feb;color:#fff;border:0;padding:9px 15px;border-radius:7px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
  .btn.ghost{background:#eef2f7;color:#1a2433;border:1px solid #cfd8e6}
  .btn.green{background:#1a8f4c}
  table{border-collapse:collapse;width:100%;font-size:12px;background:#fff}
  th,td{border:1px solid #bbb;padding:5px 6px;vertical-align:top}
  th{background:#0f2740;color:#fff;font-weight:600;position:sticky;top:0;z-index:1}
  th small{display:block;font-weight:400;opacity:.8;font-size:10px}
  td.img img{width:64px;height:64px;object-fit:cover;border-radius:4px}
  td.nm{min-width:160px}td.nm .tr{font-size:11px;color:#555;margin-top:2px}
  td.ref{white-space:nowrap;font-weight:600;color:#0f2740}
  tr:nth-child(even) td{background:#f7f9fc}
  input.q{width:100%;border:1px solid #cfd8e6;border-radius:5px;padding:5px 6px;font-size:12px;box-sizing:border-box}
  input.q:focus{outline:2px solid #1f6feb33;border-color:#1f6feb}
  td.money{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .line{font-weight:600}
  tfoot td{background:#eef5ff;font-weight:700;border-top:2px solid #0f2740}
  a{color:#1f6feb}
  .loading{padding:40px;text-align:center;color:#666}
  @media print{
    .bar,.top .hidep{display:none}
    body{background:#fff}
    input.q{border:none;padding:0}
    th{position:static}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="loading">Loading…</div></div>
</div>
<script src="xlsx.full.min.js"></script>
<script>
const SUPABASE_URL="https://awhijbgonnmbmymvbzlb.supabase.co";
const SUPABASE_KEY="sb_publishable_0gCzyKbXWiWj-UCvyI9mXg_ixERRH0B";
const L={
  en:{title:'Quotation',sub:'Enter the prices your supplier quoted. Products are listed in REF order. Line totals and the grand total update automatically.',
      no:'No.',img:'Image',ref:'Ref',name:'Product',qty:'Qty',price:'Unit Price',moq:'MOQ',lead:'Lead Time',incoterm:'Incoterm',sample:'Sample Cost',remark:'Remarks',line:'Line Total',
      supplier:'Supplier',qref:'Supplier quote ref',qdate:'Quote date',cur:'Currency',from:'From',date:'Date',total:'Grand total',
      print:'🖨 Print / Save PDF',csv:'⬇ Export CSV',xlsx:'⬇ Export Excel',save:'💾 Save to app'},
  zh:{title:'报价单',sub:'录入供应商报价。产品按编号(REF)排序，小计与总计自动计算。',
      no:'序号',img:'图片',ref:'编号',name:'产品',qty:'数量',price:'单价',moq:'最小起订量',lead:'交货期',incoterm:'贸易术语',sample:'样品费',remark:'备注',line:'小计',
      supplier:'供应商',qref:'供应商报价单号',qdate:'报价日期',cur:'货币',from:'来自',date:'日期',total:'总计',
      print:'🖨 打印 / 存为PDF',csv:'⬇ 导出CSV',xlsx:'⬇ 导出Excel',save:'💾 保存到系统'}
};
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params=new URLSearchParams(location.search);
const labelLang=(params.get('lang')==='zh')?'zh':'en';
document.documentElement.lang=labelLang;
// bilingual header helper (EN + 中文 unless a single lang is forced)
const bi=(k)=> params.get('lang') ? L[labelLang][k] : (L.en[k]+' <small>'+L.zh[k]+'</small>');
const ids=(params.get('ids')||'').split(',').map(s=>s.trim()).filter(Boolean);
let ITEMS=[];

async function api(pathAndQuery){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+pathAndQuery,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function load(){
  if(!ids.length){document.getElementById('app').innerHTML='<div class="loading">No products selected. Go back to the Products tab, tick some products, then click <b>Enter quotes</b>.</div>';return;}
  let brand='Interpoint';
  try{
    const products=await api('products?select=id,ref,name,name_en,name_zh,image,qty,url,status&id=in.('+ids.join(',')+')');
    try{const s=await api("settings?select=brand&id=eq.app");if(s&&s[0]&&s[0].brand)brand=s[0].brand;}catch(e){}
    const byId={};products.forEach(p=>byId[p.id]=p);
    // keep requested order but then sort by REF (defensive — the opener already sorts)
    ITEMS=ids.map(id=>byId[id]).filter(Boolean).sort((a,b)=>String(a.ref||'').localeCompare(String(b.ref||'')));
    render(brand);
  }catch(e){
    document.getElementById('app').innerHTML='<div class="loading">Could not load the products ('+esc(e.message)+').<br>Please check your internet connection and try again.</div>';
  }
}
function nmeLines(p){
  const ls=[p.name_zh,p.name_en,p.name].filter(Boolean);
  const seen={},out=[];ls.forEach(t=>{if(!seen[t]){seen[t]=1;out.push(t);}});
  return out.length?out:[p.name||''];
}
function render(brand){
  const Lx=L[labelLang];
  const rows=ITEMS.map((p,i)=>`<tr data-id="${esc(p.id)}" data-qty="${p.qty!=null?p.qty:''}">
    <td>${i+1}</td>
    <td class="img">${p.image?`<img src="${esc(p.image)}" loading="lazy">`:''}</td>
    <td class="ref">${esc(p.ref||'')}</td>
    <td class="nm">${nmeLines(p).map((t,k)=>k===0?esc(t):`<div class="tr">${esc(t)}</div>`).join('')}</td>
    <td class="money"><input class="q" data-f="qty" type="number" min="0" step="1" value="${p.qty!=null?p.qty:''}" oninput="recalc()" style="width:62px;text-align:right" placeholder="0"></td>
    <td><input class="q" data-f="price" type="number" min="0" step="0.01" oninput="recalc()" placeholder="0.00"></td>
    <td><input class="q" data-f="moq" type="text" placeholder=""></td>
    <td><input class="q" data-f="lead" type="text" placeholder=""></td>
    <td><input class="q" data-f="incoterm" type="text" placeholder="FOB / EXW…"></td>
    <td><input class="q" data-f="remark" type="text" placeholder=""></td>
    <td class="money line" data-line>—</td>
  </tr>`).join('');
  document.getElementById('app').innerHTML=`
    <h1>${esc(Lx.title)}</h1>
    <div class="meta">${Lx.from}: ${esc(brand)} &nbsp;|&nbsp; ✉ jarrodliu@hotmail.com &nbsp;|&nbsp; ${Lx.date}: ${new Date().toISOString().slice(0,10)} &nbsp;|&nbsp; ${ITEMS.length} ${labelLang==='zh'?'项':'items'}</div>
    <div class="note">${esc(Lx.sub)}</div>
    <div class="top">
      <div class="fld"><label>${esc(Lx.supplier)} 供应商</label><input id="f_supplier" placeholder=""></div>
      <div class="fld"><label>${esc(Lx.qref)} 报价单号</label><input id="f_qref" placeholder=""></div>
      <div class="fld"><label>${esc(Lx.qdate)} 报价日期</label><input id="f_qdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="fld"><label>${esc(Lx.cur)} 货币</label><input id="f_cur" value="EUR" style="min-width:80px"></div>
    </div>
    <div class="bar">
      <button class="btn green" onclick="saveToApp()">${Lx.save}</button>
      <button class="btn" onclick="exportXLSX()">${Lx.xlsx}</button>
      <button class="btn ghost" onclick="exportCSV()">${Lx.csv}</button>
      <button class="btn ghost" onclick="window.print()">${Lx.print}</button>
      <span class="note" id="saveMsg" style="margin:0">${labelLang==='zh'?'“保存到系统”会把报价写入产品的“最优报价”。':'“Save to app” writes these into each product’s Best quote.'}</span>
    </div>
    <table><thead><tr>
      <th>${bi('no')}</th><th>${bi('img')}</th><th>${bi('ref')}</th><th>${bi('name')}</th>
      <th>${bi('qty')}</th><th>${bi('price')}</th><th>${bi('moq')}</th><th>${bi('lead')}</th>
      <th>${bi('incoterm')}</th><th>${bi('remark')}</th><th>${bi('line')}</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="10" class="money">${esc(Lx.total)} · <span id="g_cur">EUR</span></td><td class="money" id="g_total">—</td></tr></tfoot>
    </table>`;
  document.getElementById('f_cur').addEventListener('input',recalc);
  recalc();
}
function recalc(){
  const cur=(document.getElementById('f_cur').value||'EUR');
  document.getElementById('g_cur').textContent=cur;
  let gt=0, any=false;
  document.querySelectorAll('tbody tr').forEach(tr=>{
    const qtyEl=tr.querySelector('input[data-f="qty"]');
    const qty=parseFloat(qtyEl?qtyEl.value:tr.getAttribute('data-qty'))||0;
    const price=parseFloat(tr.querySelector('input[data-f="price"]').value);
    const cell=tr.querySelector('[data-line]');
    if(!isNaN(price)){ const line=qty*price; gt+=line; any=true; cell.textContent=line.toFixed(2); }
    else cell.textContent='—';
  });
  document.getElementById('g_total').textContent=any?gt.toFixed(2):'—';
}
function val(tr,f){const el=tr.querySelector('input[data-f="'+f+'"]');return el?el.value:'';}
function exportCSV(){
  const cur=document.getElementById('f_cur').value||'EUR';
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const meta=[['QUOTATION'],['Supplier',document.getElementById('f_supplier').value],
    ['Supplier quote ref',document.getElementById('f_qref').value],['Quote date',document.getElementById('f_qdate').value],
    ['Currency',cur],['Exported',new Date().toLocaleString()],[]];
  const head=['Ref','Product','Image_URL','Qty','Unit_Price','Line_Total','MOQ','Lead','Incoterm','Remarks'];
  const lines=meta.map(r=>r.map(q).join(','));
  lines.push(head.map(q).join(','));
  let gt=0;
  document.querySelectorAll('tbody tr').forEach(tr=>{
    const p=ITEMS.find(x=>x.id===tr.getAttribute('data-id'))||{};
    const qtyStr=val(tr,'qty');
    const qty=parseFloat(qtyStr)||0;
    const price=parseFloat(val(tr,'price'));
    const line=isNaN(price)?'':(qty*price).toFixed(2);
    if(line!=='')gt+=qty*price;
    lines.push([p.ref||'',p.name||'',p.image||'',qtyStr,isNaN(price)?'':price.toFixed(2),line,
      val(tr,'moq'),val(tr,'lead'),val(tr,'incoterm'),val(tr,'remark')].map(q).join(','));
  });
  lines.push(['','','','','Grand total '+gt.toFixed(2),'','','','',''].map(q).join(','));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const sup=(document.getElementById('f_supplier').value||'quotation').replace(/\W+/g,'_');
  a.download='quotation_'+sup+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}

// ---- helpers shared by Excel export + Save to app ----
const uid=p=>(p||'')+Math.random().toString(36).slice(2,9);
const num=v=>{if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n};
function collectRows(){
  return [...document.querySelectorAll('tbody tr')].map(tr=>{
    const p=ITEMS.find(x=>x.id===tr.getAttribute('data-id'))||{};
    const qtyStr=val(tr,'qty'); const qty=parseFloat(qtyStr)||0;
    const price=parseFloat(val(tr,'price'));
    return {p,tr,qtyStr,qty,price,moq:val(tr,'moq'),lead:val(tr,'lead'),incoterm:val(tr,'incoterm'),remark:val(tr,'remark')};
  });
}
async function writeApi(path,method,body,extra){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{method,
    headers:Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},extra||{}),
    body:body?JSON.stringify(body):undefined});
  if(!r.ok){throw new Error('HTTP '+r.status+' '+(await r.text()));}
  return r;
}

function exportXLSX(){
  if(typeof XLSX==='undefined'){alert('Excel library not loaded — use CSV instead.');return;}
  const cur=document.getElementById('f_cur').value||'EUR';
  const meta=[['QUOTATION'],['Supplier',document.getElementById('f_supplier').value],
    ['Supplier quote ref',document.getElementById('f_qref').value],['Quote date',document.getElementById('f_qdate').value],
    ['Currency',cur],['Exported',new Date().toLocaleString()],[]];
  const head=['Ref','Product','Image_URL','Qty','Unit_Price','Line_Total','MOQ','Lead','Incoterm','Remarks'];
  const rows=collectRows(); let gt=0;
  const data=rows.map(r=>{const line=isNaN(r.price)?'':+(r.qty*r.price).toFixed(2); if(line!=='')gt+=r.qty*r.price;
    return [r.p.ref||'',r.p.name||'',r.p.image||'',r.qtyStr,isNaN(r.price)?'':+r.price.toFixed(2),line,r.moq,r.lead,r.incoterm,r.remark];});
  const aoa=meta.concat([head],data,[['','','','','Grand total',+gt.toFixed(2),'','','','']]);
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:10},{wch:46},{wch:34},{wch:6},{wch:11},{wch:12},{wch:10},{wch:12},{wch:10},{wch:24}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Quotation');
  const sup=(document.getElementById('f_supplier').value||'quotation').replace(/\W+/g,'_');
  XLSX.writeFile(wb,'quotation_'+sup+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

async function saveToApp(){
  const rows=collectRows().filter(r=>!isNaN(r.price));
  if(!rows.length){alert('Enter at least one unit price first.');return;}
  const msg=document.getElementById('saveMsg');
  msg.innerHTML=labelLang==='zh'?'保存中…':'Saving…';
  try{
    const supName=(document.getElementById('f_supplier').value||'').trim();
    let supId=null;
    if(supName){ try{const sup=await api('suppliers?select=id,name');const m=sup.find(s=>(s.name||'').trim().toLowerCase()===supName.toLowerCase());if(m)supId=m.id;}catch(e){} }
    const qref=(document.getElementById('f_qref').value||'').trim();
    const qdate=document.getElementById('f_qdate').value||'';
    const payload=rows.map(r=>{
      const nb=[]; if(supName&&!supId)nb.push('Supplier: '+supName); if(qref)nb.push('Quote '+qref); if(qdate)nb.push(qdate); if(r.remark)nb.push(r.remark);
      const qid=r.tr.getAttribute('data-qid')||uid('q'); r.tr.setAttribute('data-qid',qid);
      return {id:qid,product_id:r.p.id,supplier_id:supId,price:r.price,moq:num(r.moq),lead:r.lead||null,incoterm:r.incoterm||null,sample:null,notes:nb.join(' · ')||null};
    });
    await writeApi('quotes','POST',payload,{Prefer:'resolution=merge-duplicates'});
    const toQ=rows.filter(r=>r.p.status==='New').map(r=>r.p.id);
    if(toQ.length){ try{ await writeApi('products?id=in.('+toQ.join(',')+')','PATCH',{status:'Quoted'},{Prefer:'return=minimal'}); rows.forEach(r=>{if(r.p.status==='New')r.p.status='Quoted';}); }catch(e){} }
    msg.innerHTML='<b style="color:#1a8f4c">✓ '+(labelLang==='zh'?('已保存 '+payload.length+' 条报价到系统。'):('Saved '+payload.length+' quote(s) to the app — refresh the Products tab to see Best quote.'))+'</b>';
  }catch(e){
    msg.innerHTML='<b style="color:#c00">'+(labelLang==='zh'?'保存失败：':'Save failed: ')+esc(e.message)+'</b>';
  }
}
load();
</script>
</body>
</html>
